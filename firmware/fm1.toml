# MIFM1 (fm1-base tools/build.py: from base/, `tools/build.py ../firmware`): a four-track groovebox on Mutable
# Instruments' code and the LXR-02's drum voices. The modules' biggest tables (247 KB) live in the resource region,
# which the installer writes after the firmware (tools/split_tables.py), so the code fits the FM-1's 581 KB of program
# flash with room to spare.
name = "MIFM1"
id_prefix = "FM-1_67"          # package identity: dev FM-1_6700, releases FM-1_67XXYYZZ
usb_manufacturer = "mifm1"
usb_product = "MIFM1 FM-1"
# the modules (C++, -O2), each directory listed: Mutable Instruments' code (third_party, MIT), the LXR-02's drum
# voices (third_party/lxr: Erica Synths' LXR firmware, GPL-3.0), the bridges and the engine (mi). The linker leaves
# out what nothing calls
o2 = ["mi/*.cc",
      "third_party/stmlib/dsp/*.cc", "third_party/stmlib/utils/*.cc",
      "third_party/plaits/*.cc", "third_party/plaits/dsp/*.cc", "third_party/plaits/dsp/engine/*.cc",
      "third_party/plaits/dsp/engine2/*.cc", "third_party/plaits/dsp/chords/*.cc", "third_party/plaits/dsp/fm/*.cc",
      "third_party/plaits/dsp/physical_modelling/*.cc", "third_party/plaits/dsp/speech/*.cc",
      "third_party/clouds/*.cc", "third_party/clouds/dsp/*.cc", "third_party/clouds/dsp/pvoc/*.cc",
      "third_party/warps/*.cc", "third_party/warps/dsp/*.cc",
      "third_party/tides2/*.cc",
      "third_party/marbles/*.cc", "third_party/marbles/random/*.cc", "third_party/marbles/ramp/*.cc",
      "third_party/lxr/*.cc", "third_party/lxr/Soundengine/DSPAudio/*.cc"]
o2_cflags = ["-std=gnu++11", "-fno-exceptions", "-fno-rtti", "-fno-threadsafe-statics", "-fno-use-cxa-atexit",
             "-fdata-sections", "-DTEST",
             "-Wno-unused-local-typedef"]   # (stmlib's STATIC_ASSERT: a typedef per use)
# the code the FM-1 runs from RAM (0.14.4). Its code runs in place from the flash, through a small cache: code not in
# it yet waits for the flash, about 1 us a 32-byte line (on the stress test, the first FM track of a block paid
# ~170 us for the FM's code, the same FM on the next track nothing: instruction counts never see it). What every
# track runs at every block goes in the RAM the FM-1 keeps for code (42 KB since 0.14.5, copied at boot): these functions as
# compiled, the same instructions, their sections renamed into it (o2_ram: fm1-base patched,
# patches/fm1-base-o2-device.patch, elf_rename); the RAM and the flash 4 MB apart, beyond a call's reach, their units with
# JieLi's long calls (o2_device). The audio runs in its interrupt and on the second core, never while the flash is off
o2_ram = ["mi/engine.cc:_ZN12_GLOBAL__N_18run_taskEij", "mi/engine.cc:_ZN12_GLOBAL__N_112render_voiceEij",
          "mi/engine.cc:_ZN12_GLOBAL__N_19set_voiceEi", "mi/engine.cc:_ZN12_GLOBAL__N_110set_filterEi",
          "mi/engine.cc:_ZN12_GLOBAL__N_19core1_jobEj", "mi/engine.cc:_ZN12_GLOBAL__N_18bend_oneERNS_4BendEf",
          "mi/engine.cc:_ZN12_GLOBAL__N_112apply_cablesEv", "mi/engine.cc:_ZN12_GLOBAL__N_112apply_traumaEiPfj",
          "mi/mi_filter.cc:mf_process", "mi/mi_filter.cc:mf_set", "mi/mi_filter.cc:_ZN12_GLOBAL__N_15coefsERNS_6FilterEf",
          "mi/mi_filter.cc:_ZN12_GLOBAL__N_18drive_inERNS_6FilterEfffff",
          "mi/mi_filter.cc:_ZN12_GLOBAL__N_19sub_blockERNS_6FilterERNS_3RunEjjPj",
          "mi/mi_filter.cc:_ZN12_GLOBAL__N_18fm_coefsERNS_6FilterERKNS_3RunE",
          "mi/mi_filter.cc:_ZN12_GLOBAL__N_17processERNS_6FilterEPfj",
          "mi/mi_drum.cc:drum_render",
          "mi/mi_fm4.cc:fm4_render", "mi/mi_fm4.cc:_ZN12_GLOBAL__N_14coreILb0ELi0EEEvRNS_5VoiceERKNS_4CoreEPfi",
          "mi/mi_fm4.cc:_ZN12_GLOBAL__N_14coreILb1ELi0EEEvRNS_5VoiceERKNS_4CoreEPfi",
          "mi/mi_fm4.cc:_ZN12_GLOBAL__N_14coreILb0ELi1EEEvRNS_5VoiceERKNS_4CoreEPfi",
          "mi/mi_fm4.cc:_ZN12_GLOBAL__N_14coreILb1ELi1EEEvRNS_5VoiceERKNS_4CoreEPfi",
          "mi/mi_fm4.cc:_ZN12_GLOBAL__N_14coreILb0ELi2EEEvRNS_5VoiceERKNS_4CoreEPfi",
          "mi/mi_fm4.cc:_ZN12_GLOBAL__N_14coreILb1ELi2EEEvRNS_5VoiceERKNS_4CoreEPfi",
          "mi/mi_fm4.cc:_ZN12_GLOBAL__N_18shape_atERKNS_5ShapeEf", "mi/mi_fm4.cc:_ZN12_GLOBAL__N_15t60_sEf",
          "mi/mi_fm4.cc:_ZL7fm_expff", "mi/mi_fm4.cc:_ZL8fm_exp2ff", "mi/mi_fm4.cc:_ZL8fm_log2ff"]
o2_device = ["mi/engine.cc", "mi/mi_filter.cc", "mi/mi_drum.cc", "mi/mi_fm4.cc"]
o2_device_cflags = ["-mllvm", "-pi32v2-large-program=true"]
include = ["third_party", "third_party/lxr"]
device_include = ["shim"]      # the C and C++ headers the FM-1's toolchain has not (no libm, no C++ library)
vendored = ["third_party/"]
words = "words.tsv"
ble = false                    # no radio: its RAM goes to the modules
usb_audio_in = true            # the FM-1 recordable over the cable: a USB sound card (class compliant, no driver),
                               # 2 inputs, 16-bit at 44.1 kHz: the master mix, MASTER aside (0.16.33; before, 10:
                               # the tracks apart, set aside: app.h, patches/fm1-base-usb-multi.patch); 0.16.34 the
                               # app's frames, without the metronome, 3 dB under full scale (app.h FM1B_UAC_APP);
                               # 0.16.35 at 44.1 or 48 kHz, the host's choice (app.h FM1B_UAC_48K, usb48.h)
usb_audio_out = false          # (a computer playing through it: not asked for, and not made the default output)
cpu2 = true                    # the second core: tracks 3 and 4
cpu2_fallback = true           # a failure of it: one core until power-off, not a restart
backup = true                  # the project, to a file (and the resource region's transfer is the restore's)
mirror = true                  # (0.16.53) the screen and the panel on a computer or an Android phone, over USB-MIDI
                               # (fm1-base's device/mirror.c; the site's mirror/ page, Web MIDI: Chrome, Edge,
                               # Firefox; not Safari, so no iPhone or iPad): ~5.5 KB of RAM and ~9.8 KB of the pool,
                               # 6 of them the delay's line's (1.2 s to 1.13 s, mi_delay.cc); nothing while nobody
                               # watches but a test at each blit, and while it mirrors the main loop's work, never the
                               # sound's
backup_ext = "mifm1"
backup_holds = "the saved project"
resources = "res/mi_tables.bin"   # the moved tables, as the FM-1 reads them in place (tools/split_tables.py)
resources_what = "the modules' tables"
resources_what_ja = "モジュールのテーブル"
# the site (the installer)
tagline = "groovebox Mutable Instruments"
repo = "https://github.com/distortedimages-code/MIFM1"
licence = "GPL-3.0-only (the firmware as a whole; its files MPL-2.0, MIT or GPL-3.0: LICENSING.md)"
credits = "Built on Mutable Instruments' open source code (Emilie Gillet, MIT), the drum voices of Erica Synths' LXR-02 firmware (GPL-3.0) and fm1-base (MPL-2.0)."
