# MIFM1 (fm1-base tools/build.py: from base/, `tools/build.py ../firmware`): a four-track groovebox on Mutable
# Instruments' code. The modules' biggest tables (145 KB) live in the resource region, which the installer writes
# after the firmware (tools/split_tables.py), so the code fits the FM-1's 581 KB of program flash with room to spare.
name = "MIFM1"
id_prefix = "FM-1_67"          # package identity: dev FM-1_6700, releases FM-1_67XXYYZZ
usb_manufacturer = "mifm1"
usb_product = "MIFM1 FM-1"
# the modules (C++, -O2), each directory listed: Mutable Instruments' code (third_party, MIT), the bridges and the
# engine (mi). Clouds and Warps are built and not played yet (v0.2): the linker leaves out what nothing calls
o2 = ["mi/*.cc",
      "third_party/stmlib/dsp/*.cc", "third_party/stmlib/utils/*.cc",
      "third_party/plaits/*.cc", "third_party/plaits/dsp/*.cc", "third_party/plaits/dsp/engine/*.cc",
      "third_party/plaits/dsp/engine2/*.cc", "third_party/plaits/dsp/chords/*.cc", "third_party/plaits/dsp/fm/*.cc",
      "third_party/plaits/dsp/physical_modelling/*.cc", "third_party/plaits/dsp/speech/*.cc",
      "third_party/clouds/*.cc", "third_party/clouds/dsp/*.cc", "third_party/clouds/dsp/pvoc/*.cc",
      "third_party/warps/*.cc", "third_party/warps/dsp/*.cc",
      "third_party/tides2/*.cc",
      "third_party/marbles/*.cc", "third_party/marbles/random/*.cc", "third_party/marbles/ramp/*.cc"]
o2_cflags = ["-std=gnu++11", "-fno-exceptions", "-fno-rtti", "-fno-threadsafe-statics", "-fno-use-cxa-atexit",
             "-fdata-sections", "-DTEST", "-DMIFM1_RAM_CODE",   # (Warps' modulator in RAM: PATCHES.md 7)
             "-Wno-unused-local-typedef"]   # (stmlib's STATIC_ASSERT: a typedef per use)
include = ["third_party"]
device_include = ["shim"]      # the C and C++ headers the FM-1's toolchain has not (no libm, no C++ library)
vendored = ["third_party/"]
words = "words.tsv"
ble = false                    # no radio: its RAM goes to the modules
usb_audio_in = false
usb_audio_out = false
cpu2 = true                    # the second core: tracks 3 and 4
cpu2_fallback = true           # a failure of it: one core until power-off, not a restart
backup = true                  # the project, to a file (and the resource region's transfer is the restore's)
backup_ext = "mifm1"
backup_holds = "the saved project"
resources = "res/mi_tables.bin"   # the moved tables, as the FM-1 reads them in place (tools/split_tables.py)
resources_what = "the Mutable Instruments tables"
resources_what_ja = "Mutable Instruments のテーブル"
# the site (the installer)
tagline = "groovebox Mutable Instruments"
repo = "https://github.com/distortedimages-code/MIFM1"
licence = "MPL-2.0; Mutable Instruments' code MIT"
credits = "Built on Mutable Instruments' open source code (Emilie Gillet, MIT) and fm1-base (MPL-2.0)."
