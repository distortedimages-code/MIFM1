# MIFM1 on GitHub (after ZINZIN's workflow): on every push, the tests on a computer (every scene plays; the FM-1's
# constraints with the computer's clang; the host simulator's screens), then the firmware, its resource region (the
# modules' biggest tables) and its web installer with m-bootloader, published on the repository's GitHub Pages
# (Settings > Pages > Source: GitHub Actions). Then everything happens in Chrome or Edge:
# https://<account>.github.io/<repository>/
# The firmware job fetches JieLi's toolchain (pkgman.jieliapp.com) and the three files of the AC79 SDK a package
# needs (cpu/wl82/tools, Apache-2.0), as fm1-base's README describes.
name: firmware
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:                     # a newer push of the same branch replaces a run; branches do not cancel each other
  group: firmware-${{ github.ref }}
  cancel-in-progress: true
env:
  VERSION: "0.5.3"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: sudo apt-get update -q && sudo apt-get install -y -q lld llvm
      - run: pip install pillow
      - name: The moved tables, as tools/split_tables.py makes them from the vendored code
        run: |
          sh tools/patch_mi.sh
          git diff --exit-code -- firmware/ || { echo "::error title=tables::run tools/patch_mi.sh and commit"; exit 1; }
      - name: The engine on a computer (the default patch plays, every track and model sounds; the region's file is the arrays' bytes)
        run: make test
      - name: The FM-1's constraints (no libm, no C++ library, no double; the moved tables at the region's addresses)
        shell: bash                # (pipefail: the check's failure, not tail's success)
        run: sh tools/device_check.sh | tail -14
      - name: The host simulator's screens (the pages, a cable in MOD mode, a save across a power-off and in a backup, an FM-1 without the tables)
        run: |
          (cd base && python3 tools/build.py ../firmware --host) > host.log 2>&1 || { tail -40 host.log; exit 1; }
          mkdir -p build/host_out
          firmware/build/host/mifm1_host firmware/tests/screens.txt build/host_out
      - uses: actions/upload-artifact@v4
        with:
          name: computer
          path: |
            build/wav/*.wav
            build/host_out/*.png
            build/host_out/*.wav
  firmware:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: pip install pillow
      - name: JieLi toolchain
        run: |
          sh base/tools/get_toolchain.sh "$HOME/.jieli"
          echo "JIELI_TOOLCHAIN=$HOME/.jieli/toolchain" >> "$GITHUB_ENV"
      - name: AC79 SDK (the package's three files, as in AC79NN_SDK_V1.2.1, the version fm1-base was tested with)
        shell: bash
        run: |
          SDK="$HOME/fw-AC79_AIoT_SDK"
          git clone -q --filter=blob:none --no-checkout https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK "$SDK"
          cd "$SDK"
          git sparse-checkout set --no-cone cpu/wl82/tools/uboot.boot cpu/wl82/tools/cfg_tool.bin cpu/wl82/tools/cfg/eq_cfg_hw.bin
          want=4e3b4c220dc96641cb5a723f41e68ce41d5261ae9434bb33fbd7f2c59976ded4
          found=""
          for ref in $(git log --all --format=%H -- cpu/wl82/tools/uboot.boot); do
            git checkout -q "$ref" 2>/dev/null || continue
            if [ "$(sha256sum cpu/wl82/tools/uboot.boot | cut -d' ' -f1)" = "$want" ]; then found="$ref"; break; fi
          done
          if [ -z "$found" ]; then
            echo "::error title=sdk::no commit with V1.2.1's uboot.boot. Tags: $(git tag -l | tr '\n' ' ')"
            exit 1
          fi
          echo "AC79_SDK=$SDK" >> "$GITHUB_ENV"
      - name: The firmware
        shell: bash
        run: |
          set -o pipefail
          annotate() { python3 -c "import sys; t = sys.stdin.read().replace('%', '%25').replace('\r', '').replace('\n', '%0A'); print('::$1 title=$2::' + t)"; }
          (cd base && python3 tools/build.py ../firmware --release "$VERSION") 2>&1 | tee build.log || {
            { grep -nE "error|build:|undefined|outside the BSP|overflow|too (big|large)" build.log | grep -v "warning:" | tail -n 60
              echo ...; tail -n 25 build.log; } | annotate error "build"; exit 1; }
          # what the build says about sizes and RAM
          tail -n 40 build.log | annotate notice "build"
          ls -la firmware/build/*.fwsc firmware/build/*-res.bin
      - name: The moved tables' references, as linked (their addresses, none with its halfwords swapped)
        run: python3 tools/check_res_links.py firmware/build/mifm1.elf firmware/res/symbols.txt
      - name: No static initializer in the modules as JieLi's compiler built them (the FM-1 never runs one)
        run: python3 tools/no_static_init.py firmware/build/o2/*.o
      - name: The installer and the backup page
        run: |
          python3 tools/make_installer.py firmware/build/mifm1-"$VERSION".fwsc "$VERSION" site
          python3 tools/make_index.py site "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: mifm1-fwsc
          path: |
            firmware/build/*.fwsc
            firmware/build/*-res.bin
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  pages:
    needs: firmware
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
